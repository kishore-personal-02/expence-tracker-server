<div class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-logo">₹</span>
      <span class="auth-brand-name">Expense Tracker</span>
    </div>
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Log in to continue tracking your spending</p>
    @if (error()) {
      <div class="alert alert-error" role="alert">{{ error() }}</div>
    }
    <form (submit)="onSubmit($event)">
      <div class="form-group">
        <label for="email">
          Email<span class="field-req">*</span>
        </label>
        <input
          id="email"
          type="email"
          [value]="email()"
          (input)="email.set($any($event).target.value)"
          required
          placeholder="you@example.com"
          autocomplete="email"
        />
      </div>
      <div class="form-group">
        <label for="password">
          Password<span class="field-req">*</span>
        </label>
        <input
          id="password"
          type="password"
          [value]="password()"
          (input)="password.set($any($event).target.value)"
          required
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>
      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
        @if (loading()) {
          <span class="btn-spinner" aria-hidden="true"></span>
          Logging in…
        } @else {
          Log In
        }
      </button>
    </form>
    <p class="auth-footer">
      Don&apos;t have an account? <a routerLink="/register">Sign up</a>
    </p>
  </div>
</div>
